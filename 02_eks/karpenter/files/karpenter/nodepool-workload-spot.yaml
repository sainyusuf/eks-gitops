apiVersion: karpenter.sh/v1
kind: NodePool
metadata:
  name: workload-spot
spec:
  # Lower weight than on-demand pool
  weight: 1
  
  limits:
    cpu: "100"     # Higher limit for general workloads
    memory: 200Gi

  disruption:
    consolidationPolicy: WhenEmptyOrUnderutilized
    consolidateAfter: 1m  # Quick consolidation for cost savings
    
    # Allow some disruption but not too aggressive
    budgets:
      - nodes: "20%"  # Max 20% of nodes can be disrupted at once

  template:
    metadata:
      labels:
        workload: general
        node-type: spot
        cost-category: variable
    spec:
      nodeClassRef:
        group: karpenter.k8s.aws
        kind: EC2NodeClass
        name: default
      
      # Expire nodes after 7 days to get fresh instances
      expireAfter: 168h  # 7 days
      
      requirements:
        # Spot instances for cost savings (up to 90% cheaper)
        - key: karpenter.sh/capacity-type
          operator: In
          values: ["spot"]
        
        # Prefer ARM for additional savings
        - key: kubernetes.io/arch
          operator: In
          values: ["arm64"]  # ARM only for maximum savings
        
        # Wide range of ARM instance families for spot availability
        - key: karpenter.k8s.aws/instance-family
          operator: In
          values: [
            "t4g",   # Burstable, very cheap
            "m7g",   # General purpose, latest gen
            "m6g",   # General purpose
            "c7g",   # Compute optimized
            "c6g",   # Compute optimized
            "r7g",   # Memory optimized
            "r6g"    # Memory optimized
          ]
        
        # Sizes that support 20-25 pods comfortably
        - key: karpenter.k8s.aws/instance-size
          operator: In
          values: ["large", "xlarge"]
        
        # Ensure good availability zones
        - key: topology.kubernetes.io/zone
          operator: In
          values: ["eu-central-1a", "eu-central-1b", "eu-central-1c"]
      
      # Startup taints to ensure pods don't schedule until node is ready
      startupTaints:
        - key: node.kubernetes.io/not-ready
          effect: NoSchedule
