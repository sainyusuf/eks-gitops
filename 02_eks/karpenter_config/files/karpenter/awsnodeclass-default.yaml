apiVersion: karpenter.k8s.aws/v1
kind: EC2NodeClass
metadata:
  name: default
spec:
  amiSelectorTerms:
    - alias: al2023@latest  # Amazon Linux 2023 supports ARM and has better pod density
  role: ${karpenter_node_role}
  subnetSelectorTerms:
    - tags:
        karpenter.sh/discovery/${cluster_name}: "true"
  securityGroupSelectorTerms:
    - tags:
        karpenter.sh/discovery/${cluster_name}: "true"
  blockDeviceMappings:
    - deviceName: /dev/xvda
      ebs:
        volumeSize: 50Gi
        volumeType: gp3
        encrypted: true
        deleteOnTermination: true
  userData: |
    #!/bin/bash
    # Increase max pods for better density (target: 20-25 pods per node)
    echo "MAX_PODS=29" >> /etc/eks/bootstrap.sh
  tags:
    karpenter.sh/discovery/${cluster_name}: "true"
    ManagedBy: Karpenter
