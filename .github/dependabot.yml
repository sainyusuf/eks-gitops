# GitHub Dependabot configuration for EKS GitOps Project
# This file configures Dependabot to automatically check for updates to:
# - Terraform modules from Terraform Registry
# - GitHub Actions in workflows
# - Container images in Kubernetes manifests

version: 2
updates:
  # Terraform modules in 01_infrastructure directory
  - package-ecosystem: "terraform"
    directory: "/01_infrastructure"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
    open-pull-requests-limit: 5
    assignees:
      - "sainyusuf"
    commit-message:
      prefix: "terraform(infra)"
      include: "scope"
    labels:
      - "terraform"
      - "infrastructure"
      - "dependencies"
    ignore:
      # Ignore patch updates for stable modules
      - dependency-name: "terraform-aws-modules/vpc/aws"
        update-types: ["version-update:semver-patch"]
      - dependency-name: "terraform-aws-modules/acm/aws"
        update-types: ["version-update:semver-patch"]

  # Terraform modules in 02_eks/cluster directory
  - package-ecosystem: "terraform"
    directory: "/02_eks/cluster"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
    open-pull-requests-limit: 5
    assignees:
      - "sainyusuf"
    commit-message:
      prefix: "terraform(eks-cluster)"
      include: "scope"
    labels:
      - "terraform"
      - "eks"
      - "cluster"
      - "dependencies"
    ignore:
      # Be more careful with EKS module updates
      - dependency-name: "terraform-aws-modules/eks/aws"
        update-types: ["version-update:semver-major"]
      - dependency-name: "terraform-aws-modules/iam/aws"
        update-types: ["version-update:semver-patch"]

  # Terraform modules in 02_eks/karpenter directory
  - package-ecosystem: "terraform"
    directory: "/02_eks/karpenter"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
    open-pull-requests-limit: 5
    assignees:
      - "sainyusuf"
    commit-message:
      prefix: "terraform(karpenter)"
      include: "scope"
    labels:
      - "terraform"
      - "karpenter"
      - "dependencies"
    ignore:
      # Be careful with Karpenter module updates
      - dependency-name: "terraform-aws-modules/eks/aws"
        update-types: ["version-update:semver-major"]

  # Terraform modules in 02_eks/karpenter_config directory
  - package-ecosystem: "terraform"
    directory: "/02_eks/karpenter_config"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
    open-pull-requests-limit: 5
    assignees:
      - "sainyusuf"
    commit-message:
      prefix: "terraform(karpenter-config)"
      include: "scope"
    labels:
      - "terraform"
      - "karpenter"
      - "dependencies"

  # GitHub Actions workflows
  - package-ecosystem: "github-actions"
    directory: "/.github/workflows"
    schedule:
      interval: "weekly"
      day: "tuesday"
      time: "09:00"
    open-pull-requests-limit: 5
    assignees:
      - "sainyusuf"
    commit-message:
      prefix: "ci"
      include: "scope"
    labels:
      - "github-actions"
      - "ci/cd"
      - "dependencies"
